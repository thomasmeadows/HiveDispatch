# HiveDispatch policy for this repository. Read by the worker from the ticket worktree.
executor:
  permission_mode: dontAsk
  tools: [default]
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - "Bash(go build:*)"
    - "Bash(go test:*)"
    - "Bash(go vet:*)"
    - "Bash(gofmt:*)"
    - "Bash(golangci-lint:*)"
    - "Bash(go run github.com/golangci/golangci-lint:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
guidance: |
  Go 1.27, stdlib only plus gopkg.in/yaml.v3. Every external system sits behind an
  interface in internal/ with a fake; unit tests never touch the network.
  Before finishing, all three must pass — CI runs them and a PR with failures is not done:
    go vet ./... && go test -race ./... && golangci-lint run ./...
  If golangci-lint is not on PATH, use:
    go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...
  errcheck is on: never discard an error, including from io.WriteString and Close
  (use `_ = f()` deliberately if the error is truly irrelevant).
  Record design decisions in docs/decisions.md with the alternative rejected.
  Commit messages use conventional prefixes (feat:, fix:, test:, docs:, chore:).
